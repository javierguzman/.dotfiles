[general]
import = ["~/.config/alacritty/themes/tokyo-night-dark.toml"]

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Light" }
bold_italic = { family = "FiraCode Nerd Font", style = "SemiBold" }
size = 14.0

[window]
padding = { x = 8, y = 8 }
decorations = "buttonless"
opacity = 0.95
option_as_alt = "OnlyLeft"

[cursor]
style = { shape = "Block", blinking = "On" }

[keyboard]
bindings = [
  { key = "Left",  mods = "Alt", chars = "\u001bb" },
  { key = "Right", mods = "Alt", chars = "\u001bf" },
  { key = "Period", mods = "Alt", chars = "\u001b." },
  { key = "Comma",  mods = "Alt", chars = "\u001b," },
  { key = "Tab",    mods = "Alt", chars = "\u001b\t" },
]
