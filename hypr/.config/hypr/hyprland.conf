# Hyprland: Linux port of yabai/.config/yabai/yabairc and skhd/.config/skhd/skhdrc
# Written for Hyprland 0.53 (Ubuntu 26.04). Reload: CTRL+SUPER+R
#
# Key mapping: skhd "alt" (macOS Option) = SUPER here. On a PC keyboard, the
# Super (Windows) key is in the same place as Option on a Mac keyboard.
# Terminals do not use SUPER, so no terminal exceptions are necessary
# (skhd must let alt+h/j/k/l pass through to tmux/Neovim).

$terminal = ghostty
$menu = wofi --show drun

monitor = , preferred, auto, auto

exec-once = waybar
exec-once = mako
exec-once = systemctl --user start hyprpolkitagent

# ─── Layout (yabairc) ─────────────────────────────────────────────────────────

general {
    layout = dwindle          # yabai: layout bsp
    gaps_in = 0               # yabai: window_gap 0
    gaps_out = 0              # yabai: top/bottom/left/right_padding 0
    border_size = 1           # yabai draws no border; 1 px shows the focus
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(414868)
}

dwindle {
    force_split = 2           # yabai: window_placement second_child
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = rgb(1a1b26)   # Tokyo Night, same as the terminals
}

input {
    kb_layout = es            # macOS: "Spanish - ISO" (com.apple.HIToolbox)
    follow_mouse = 1
}

# yabai: rule --add app=".*" manage=off (all windows float; SHIFT+SUPER+T tiles one)
windowrule {
    name = float-all
    match:class = .*
    float = yes
}

# ─── Mouse (yabai mouse_modifier fn; PC keyboards have no fn, so SUPER) ───────

bindm = SUPER, mouse:272, movewindow      # mouse_action1 move
bindm = SUPER, mouse:273, resizewindow    # mouse_action2 resize

# ─── Keys (skhdrc) ────────────────────────────────────────────────────────────

# Focus: next/previous window (ctrl + alt - right/left)
bind = CTRL SUPER, right, cyclenext
bind = CTRL SUPER, left, cyclenext, prev

# Focus by direction (alt - h/j/k/l)
bind = SUPER, h, movefocus, l
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, l, movefocus, r

# Focus display (alt - s/g)
bind = SUPER, s, focusmonitor, l
bind = SUPER, g, focusmonitor, r

# Rotate / mirror (shift + alt - r/y/x): dwindle has split toggle and swap
bind = SHIFT SUPER, r, togglesplit
bind = SHIFT SUPER, y, swapsplit
bind = SHIFT SUPER, x, swapsplit

# Float <-> tile, centered at half size (shift + alt - t)
bind = SHIFT SUPER, t, togglefloating
bind = SHIFT SUPER, t, resizeactive, exact 50% 50%
bind = SHIFT SUPER, t, centerwindow

# Maximize toggle (shift + alt - m)
bind = SHIFT SUPER, m, fullscreen, 1

# Left / right half (shift + ctrl + alt - left/right)
bind = CTRL SHIFT SUPER, left, resizeactive, exact 50% 100%
bind = CTRL SHIFT SUPER, left, moveactive, exact 0 0
bind = CTRL SHIFT SUPER, right, resizeactive, exact 50% 100%
bind = CTRL SHIFT SUPER, right, moveactive, exact 50% 0

# Balance (shift + alt - e)
bind = SHIFT SUPER, e, splitratio, exact 1

# Resize. skhd uses shift + ctrl (grow) and shift + ctrl + alt (shrink).
# On Linux, Ctrl+Shift+J/K/L are app shortcuts (browser dev tools), so the
# resize keys get SUPER too: h/k shrink, l/j grow (hold the key to repeat).
binde = CTRL SHIFT SUPER, h, resizeactive, -50 0
binde = CTRL SHIFT SUPER, l, resizeactive, 50 0
binde = CTRL SHIFT SUPER, k, resizeactive, 0 -50
binde = CTRL SHIFT SUPER, j, resizeactive, 0 50

# Swap with neighbor (shift + alt - h/j/k/l)
bind = SHIFT SUPER, h, swapwindow, l
bind = SHIFT SUPER, j, swapwindow, d
bind = SHIFT SUPER, k, swapwindow, u
bind = SHIFT SUPER, l, swapwindow, r

# Warp / move in the layout (ctrl + alt - h/j/k/l)
bind = CTRL SUPER, h, movewindow, l
bind = CTRL SUPER, j, movewindow, d
bind = CTRL SUPER, k, movewindow, u
bind = CTRL SUPER, l, movewindow, r

# Send window to the display on the left/right, focus follows (shift + alt - s/g)
bind = SHIFT SUPER, s, movewindow, mon:l
bind = SHIFT SUPER, g, movewindow, mon:r

# Send window to previous/next/numbered space, focus stays (shift + alt - p/n/1-7)
bind = SHIFT SUPER, p, movetoworkspacesilent, -1
bind = SHIFT SUPER, n, movetoworkspacesilent, +1
bind = SHIFT SUPER, 1, movetoworkspacesilent, 1
bind = SHIFT SUPER, 2, movetoworkspacesilent, 2
bind = SHIFT SUPER, 3, movetoworkspacesilent, 3
bind = SHIFT SUPER, 4, movetoworkspacesilent, 4
bind = SHIFT SUPER, 5, movetoworkspacesilent, 5
bind = SHIFT SUPER, 6, movetoworkspacesilent, 6
bind = SHIFT SUPER, 7, movetoworkspacesilent, 7

# Reload the config (ctrl + alt - r restarts yabai)
bind = CTRL SUPER, r, exec, hyprctl reload

# ─── Linux only (macOS gives these without a window manager) ──────────────────

# Go to a space (macOS: Mission Control shortcuts)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7

bind = SUPER, Return, exec, $terminal     # new terminal
bind = SUPER, space, exec, $menu          # app launcher (macOS: Alfred)
bind = SHIFT SUPER, q, killactive         # close window
bind = SHIFT SUPER, Escape, exit          # log out of Hyprland
