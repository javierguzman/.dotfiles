set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
unbind '"'

bind | split-window -h
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5


bind -r m resize-pane -Z

bind -r x kill-pane
bind -r X kill-window

set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
 
# list of tmux plugins 
set -g @plugin 'christoomey/vim-tmux-navigator' 
# for navigating panes and vim/nvim with Ctrl-hjkl 

set -g @plugin 'tmux-plugins/tmux-resurrect'
# persist tmux sessions after computer restart 
set -g @plugin 'tmux-plugins/tmux-continuum' 
# automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on' 
# allow tmux-ressurect to capture pane contents 
set -g @continuum-restore 'on' 
 

# vim mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy -in -selection clipboard'

# status bar — tokyo-night
set -g status-style "bg=#1a1b26 fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7,nobold]  "
set -g status-right "#[fg=#7aa2f7] %H:%M  %d %b "
set -g status-left-length 40
setw -g window-status-format "#[fg=#c0caf5,bg=#1a1b26] #I  #W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I  #W "
set -g status-position bottom

# run cheatsheet
unbind i
bind-key -r i run-shell "tmux neww tmux-cht.sh"

# start with index 1
set -g base-index 1

# window switching
bind -n M-. select-window -n
bind -n M-, select-window -p
bind -n M-Tab last-window

# enable tmux-continuum functionality 
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf) 
run '~/.tmux/plugins/tpm/tpm'


